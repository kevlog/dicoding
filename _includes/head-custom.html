
    <!-- Setup theme-color -->
    {% include head-custom-theme-colors.html %}

    <!-- Setup Google Analytics -->
    {% include head-custom-google-analytics.html %}

    <!-- Favicon untuk semua browser -->
    <link rel="icon" type="image/x-icon" href="{{ '/assets/ico/stack-of-books.ico' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/ico/stack-of-books.ico' | relative_url }}">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.title }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ page.image | default: site.image | absolute_url }}">
    <meta name="twitter:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
